name: Build-and-Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mock-ekyc-api
  REGISTRY: ghcr.io
  NAMESPACE: startup-tenant-alpha

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    # -----------------------------------
    # Docker Login
    # -----------------------------------
    - name: Login to Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    # -----------------------------------
    # Build Docker Image
    # -----------------------------------
    - name: Build Docker Image
      run: |
        docker build \
        -t $REGISTRY/${{ github.repository }}/$IMAGE_NAME:${{ github.sha }} .

    # -----------------------------------
    # Security Scan (Trivy)
    # -----------------------------------
    - name: Run Trivy Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        format: table
        severity: HIGH,CRITICAL
        exit-code: 0

    # -----------------------------------
    # Push Image
    # -----------------------------------
    - name: Push Docker Image
      run: |
        docker push \
        $REGISTRY/${{ github.repository }}/$IMAGE_NAME:${{ github.sha }}

    # -----------------------------------
    # Setup kubectl
    # -----------------------------------
    - name: Install kubectl
      uses: azure/setup-kubectl@v4

    # -----------------------------------
    # Configure kubeconfig
    # -----------------------------------
    - name: Configure Kubernetes Access
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config

    # -----------------------------------
    # Deploy Application
    # -----------------------------------
    - name: Deploy to Kubernetes
      run: |

        kubectl create namespace $NAMESPACE \
        --dry-run=client -o yaml | kubectl apply -f -

        kubectl apply -f k8s/ -n $NAMESPACE

        kubectl set image deployment/mock-ekyc-api \
        mock-ekyc-api=$REGISTRY/${{ github.repository }}/$IMAGE_NAME:${{ github.sha }} \
        -n $NAMESPACE

        kubectl rollout status deployment/mock-ekyc-api \
        -n $NAMESPACE
