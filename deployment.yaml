apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-ekyc-api
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: mock-ekyc-api

  template:
    metadata:
      labels:
        app: mock-ekyc-api

    spec:
      containers:
      - name: mock-ekyc-api
        image: ghcr.io/mock-org/mock-ekyc-api:latest

        ports:
        - containerPort: 5000

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
